<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Campus Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }

      /* Legend Styling */
      .legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        padding: 12px 15px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 14px;
        max-width: 220px;
        z-index: 9999;
      }
      .legend h3 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      .legend div {
        margin-bottom: 6px;
        display: flex;
        align-items: center;
      }
      .legend span {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 8px;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <!-- Legend Component -->
    <div id="legend" class="legend">
      <h3>Campus Legend</h3>
      <div><span style="background: blue"></span> Devdan Block</div>
      <div><span style="background: #00ff00"></span> Sports Areas</div>
      <div><span style="background: #ff9900"></span> Academic Blocks</div>
      <div><span style="background: #f1c40f"></span> Chapel</div>
      <div><span style="background: #6a040f"></span> Canteens</div>
      <div><span style="background: #9d0208"></span> Open Auditorium</div>
      <div><span style="background: #9bf6ff"></span> Ponds</div>
      <div><span style="background: #ff00ff"></span> PU College</div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>

    <script>
      mapboxgl.accessToken =
        "pk.eyJ1IjoiYW50cmlhbSIsImEiOiJjbWh2d2NiaGowMG9rMmtyN3Bkc3JnaThwIn0.iFHfpZ6plljq9I_HTwD_pQ";

      const map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/satellite-streets-v12",
        center: [77.4395, 12.8622],
        zoom: 18,
        maxZoom: 22,
        pitch: 60,
        bearing: -20,
      });

      map.addControl(new mapboxgl.NavigationControl());

      // Add live tracking blue dot
      const geoControl = new mapboxgl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true,
      });
      map.addControl(geoControl, "top-right");

      map.on("load", () => {
        map.addSource("campus", {
          type: "geojson",
          data: "campus-data.geojson",
        });

        map.addLayer({
          id: "campus-fill",
          type: "fill",
          source: "campus",
          paint: {
            "fill-color": ["get", "color"],
            "fill-opacity": 0.55,
          },
        });

        map.addLayer({
          id: "campus-outline",
          type: "line",
          source: "campus",
          paint: {
            "line-color": "#ffffff",
            "line-width": 1.2,
          },
        });

        map.addLayer({
          id: "campus-labels",
          type: "symbol",
          source: "campus",
          layout: {
            "text-field": ["get", "name"],
            "text-size": 14,
            "text-offset": [0, 1],
          },
          paint: {
            "text-color": "#ffffff",
            "text-halo-color": "#000000",
            "text-halo-width": 1.2,
          },
        });
        map.addSource("mapbox-dem", {
          type: "raster-dem",
          url: "mapbox://mapbox.terrain-rgb",
          tileSize: 512,
          maxzoom: 14,
        });

        map.setTerrain({ source: "mapbox-dem", exaggeration: 1.5 });
        map.addLayer({
          id: "sky",
          type: "sky",
          paint: {
            "sky-type": "atmosphere",
            "sky-atmosphere-sun": [0.0, 0.0],
            "sky-atmosphere-sun-intensity": 15,
          },
        });

        // ============ CLICK ANY BUILDING → SHOW POPUP WITH DIRECTIONS ============
        map.on("click", "campus-fill", (e) => {
          const feature = e.features[0];

          const buildingName = feature.properties.name;
          const buildingCoords = feature.geometry.coordinates[0][0];
          // ^ using first vertex as the target (you can replace with centroid later)

          // Create popup with button
          new mapboxgl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(
              `
      <h3>${buildingName}</h3>
      <button id="goToBuilding" style="
        padding: 6px 10px;
        margin-top: 5px;
        background:#00aaff;
        color:white;
        border:none;
        border-radius:4px;
        cursor:pointer;
      ">Go Here</button>
    `
            )
            .addTo(map);

          // When user clicks the button, request GPS
          map.once("click", () => {
            const button = document.getElementById("goToBuilding");
            if (!button) return;

            button.onclick = () => {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  const userCoords = [
                    pos.coords.longitude,
                    pos.coords.latitude,
                  ];
                  getRoute(userCoords, buildingCoords);
                },
                () => alert("Enable GPS to get directions"),
                { enableHighAccuracy: true }
              );
            };
          });
        });
      });

      /* ---------------------------
          EVENT LOCATION (FIXED!)
      ---------------------------- */
      const eventLocation = [77.43716007569962, 12.86190057440364];

      const eventMarker = new mapboxgl.Marker({ color: "#ff0000" })
        .setLngLat(eventLocation)
        .setPopup(
          new mapboxgl.Popup().setHTML(`
            <h3>NEXUS Event</h3>
            <button id="goToEvent" style="
              padding: 6px 10px;
              margin-top: 5px;
              background:#00aaff;
              color:white;
              border:none;
              border-radius:4px;
              cursor:pointer;
            ">Show Directions</button>
        `)
        )
        .addTo(map);

      // Detect button click
      map.on("click", () => {
        const btn = document.getElementById("goToEvent");
        if (!btn) return;

        btn.onclick = () => {
          navigator.geolocation.getCurrentPosition(
            successLocation,
            errorLocation,
            { enableHighAccuracy: true }
          );
        };
      });

      function successLocation(position) {
        const userCoords = [
          position.coords.longitude,
          position.coords.latitude,
        ];
        getRoute(userCoords, eventLocation);
      }

      function errorLocation() {
        alert("Could not get your location. Please enable GPS.");
      }

      async function getRoute(start, end) {
        const query = `https://api.mapbox.com/directions/v5/mapbox/walking/${start[0]},${start[1]};${end[0]},${end[1]}?geometries=geojson&access_token=${mapboxgl.accessToken}`;

        const res = await fetch(query);
        const data = await res.json();
        const route = data.routes[0].geometry.coordinates;

        if (map.getSource("route")) {
          map.getSource("route").setData({
            type: "Feature",
            geometry: { type: "LineString", coordinates: route },
          });
        } else {
          map.addLayer({
            id: "route",
            type: "line",
            source: {
              type: "geojson",
              data: {
                type: "Feature",
                geometry: { type: "LineString", coordinates: route },
              },
            },
            paint: {
              "line-color": "#00d4ff",
              "line-width": 5,
            },
          });
        }

        const bounds = new mapboxgl.LngLatBounds();
        route.forEach((coord) => bounds.extend(coord));
        map.fitBounds(bounds, { padding: 80 });
      }

      map.easeTo({
        pitch: 60, // tilt
        bearing: -20, // rotate the map slightly
        duration: 2000,
      });
    </script>
  </body>
</html>
